name: Daily Amazon Product Monitor

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (single step)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_TENANT: ${{ secrets.FEISHU_TENANT }}
          FEISHU_SOURCE_SHEET_TOKEN: ${{ secrets.FEISHU_SOURCE_SHEET_TOKEN }}
          FEISHU_RESULT_SHEET_TOKEN: ${{ secrets.FEISHU_RESULT_SHEET_TOKEN }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_SOURCE_SHEET_ID: ${{ secrets.FEISHU_SOURCE_SHEET_ID }}
          FEISHU_RESULT_SHEET_ID: ${{ secrets.FEISHU_RESULT_SHEET_ID }}
        run: python main.py

      - name: Commit updated baseline
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline.db
          git diff --staged --quiet || git commit -m "Update baseline [skip ci]"
          git push
