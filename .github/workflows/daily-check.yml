name: Daily Amazon Product Monitor

on:
  schedule:
    # UTC 22:00 = Beijing 06:00 — 6 batches finish around 08:30-09:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_TENANT: ${{ secrets.FEISHU_TENANT }}
      FEISHU_SOURCE_SHEET_TOKEN: ${{ secrets.FEISHU_SOURCE_SHEET_TOKEN }}
      FEISHU_RESULT_SHEET_TOKEN: ${{ secrets.FEISHU_RESULT_SHEET_TOKEN }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      FEISHU_SOURCE_SHEET_ID: ${{ secrets.FEISHU_SOURCE_SHEET_ID }}
      FEISHU_RESULT_SHEET_ID: ${{ secrets.FEISHU_RESULT_SHEET_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Batch 1/6
        run: python main.py --batch 1/6

      - name: Batch 2/6
        run: python main.py --batch 2/6

      - name: Batch 3/6
        run: python main.py --batch 3/6

      - name: Batch 4/6
        run: python main.py --batch 4/6

      - name: Batch 5/6
        run: python main.py --batch 5/6

      - name: Batch 6/6
        run: python main.py --batch 6/6

      - name: Commit updated baseline
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline.db
          git diff --staged --quiet || git commit -m "Update baseline [skip ci]"
          git push
