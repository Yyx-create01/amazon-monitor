name: Amazon Daily Monitor

on:
  schedule:
    # 06:00 Beijing = 22:00 UTC (previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Smoke-test ASIN count (e.g. 3); blank means all'
        required: false
        default: ''

concurrency:
  group: amazon-asin-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run monitor
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_TENANT: ${{ secrets.FEISHU_TENANT }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_SOURCE_TABLE_ID: ${{ secrets.FEISHU_SOURCE_TABLE_ID }}
          FEISHU_RESULT_TABLE_ID: ${{ secrets.FEISHU_RESULT_TABLE_ID }}
          FEISHU_BASELINE_TABLE_ID: ${{ secrets.FEISHU_BASELINE_TABLE_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          # No CF_PROXY — Actions runs from US IP so direct access works
          REQUEST_DELAY_MIN: ${{ vars.REQUEST_DELAY_MIN || '4' }}
          REQUEST_DELAY_MAX: ${{ vars.REQUEST_DELAY_MAX || '7' }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE || '20' }}
          BATCH_PAUSE: ${{ vars.BATCH_PAUSE || '30' }}
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python main_actions.py --limit "${{ inputs.limit }}"
          else
            python main_actions.py
          fi
